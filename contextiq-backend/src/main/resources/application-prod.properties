
# ==========================================
# DATABASE CONFIGURATION
# ==========================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:contextiq}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false


# ==========================================
# GEMINI AI CONFIGURATION
# ==========================================

spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.chat.model=${GOOGLE_GENAI_CHAT_MODEL:gemini-3.5-flash-lite}
spring.ai.google.genai.chat.temperature=0.2


# ==========================================
# GEMINI EMBEDDING CONFIGURATION
# ==========================================

spring.ai.google.genai.embedding.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=1536


# ==========================================
# VECTOR DATABASE CONFIGURATION
# ==========================================

spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.initialize-schema=true


# ==========================================
# FILE UPLOAD CONFIGURATION
# ==========================================

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB


# ==========================================
# RAG CONFIGURATION
# ==========================================

spring.app.rag.chunk-size=600
spring.app.rag.top-k=5
spring.app.rag.similarity-threshold=0.60
app.rag.similarity-threshold=0.60


# ==========================================
# CORS CONFIGURATION
# ==========================================

spring.app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
spring.app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.app.cors.allowed-headers=Content-Type,Authorization
spring.app.cors.allow-credentials=true


# ==========================================
# JWT CONFIGURATION
# ==========================================

spring.jwt.secret=${JWT_SECRET}
spring.jwt.expiration=3600000


# ==========================================
# LOGGING CONFIGURATION
# ==========================================

logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.com.application.rag.contextiq_backend=INFO

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF

