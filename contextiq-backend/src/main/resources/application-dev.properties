#database configurations
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:contextiq}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


#gemini AI configurations
spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY:demo-key}
spring.ai.google.genai.chat.model=${GOOGLE_GENAI_CHAT_MODEL:gemini-3.5-flash-lite}
spring.ai.google.genai.chat.temperature=0.2

#Embedding model configurations

# Gemini embeddings, use the same API key
spring.ai.google.genai.embedding.api-key=${GOOGLE_GENAI_API_KEY}
# Embedding model
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=1536

#Google cloud vertex AI configurations
#spring.ai.google.genai.project-id=${GOOGLE_CLOUD_PROJECT_ID}
#spring.ai.google.genai.location=us-central1



#Vector store configurations

#it makes the similarity search faster.
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.initialize-schema=true




#File-size upload configurations
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB



#app configurations

spring.app.rag.chunk-size=600
#spring.app.rag.chunk-overlap=100
spring.app.rag.top-k=5
spring.app.rag.similarity-threshold=0.60
app.rag.similarity-threshold=0.60

#cors configurations
spring.app.cors.allowed-origins=*
spring.app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.app.cors.allowed-headers=*



#jwt configurations
spring.jwt.secret=${JWT_SECRET:fjnnfnfhghghttvetyuomfsxcjprwqsvbnmhdavlpihdderufnsdjnjnjnrjfnr}
spring.jwt.expiration=3600000



logging.level.org.springframework.security=TRACE
logging.level.com.application.rag.contextiq_backend=DEBUG




